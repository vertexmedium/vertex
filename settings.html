<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VERTEX - Settings</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="landing-page">


<div class="overlay">


<img src="images/logo.png" class="logo" alt="VERTEX Logo">


<h1>VERTEX</h1>

<h2>Account Settings</h2>



<form id="settingsForm">


<input 
type="text"
id="firstname"
placeholder="First Name">



<input 
type="text"
id="middlename"
placeholder="Middle Name">



<input 
type="text"
id="lastname"
placeholder="Last Name">



<input 
type="text"
id="username"
placeholder="Username">



<input 
type="email"
id="email"
placeholder="Email">



<input 
type="tel"
id="phone"
placeholder="Phone Number">



<h3>Change Password</h3>



<input 
type="password"
id="newPassword"
placeholder="New Password">



<button type="submit">

Save Changes

</button>



</form>



<div class="buttons">

<a href="account.html">
Back to Account
</a>

</div>



</div>


</div>



<script src="js/settings.js"></script>


</body>

</html>
