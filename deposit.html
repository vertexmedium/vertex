<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VERTEX - Deposit</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="landing-page">


<div class="overlay">


<img src="images/logo.png" class="logo" alt="VERTEX Logo">


<h1>VERTEX</h1>

<h2>Deposit</h2>



<form id="depositForm">


<input
type="text"
id="usdtAddress"
placeholder="Enter USDT Wallet Address"
required>



<select id="network" required>

<option value="">
Select Network
</option>

<option>
TRC20
</option>

<option>
ERC20
</option>

<option>
BEP20 (BSC)
</option>

</select>



<input
type="number"
id="amount"
placeholder="Amount"
required>



<button type="submit">

Save Deposit Details

</button>



</form>



<div class="buttons">

<a href="account.html">
Back to Account
</a>

</div>


</div>


</div>



<script src="js/deposit.js"></script>


</body>

</html>
